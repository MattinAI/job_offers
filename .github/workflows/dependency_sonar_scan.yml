name: Dependency & Sonar Scan

on:
  push:
    branches:
      - feature/devops

jobs:
  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run OWASP Dependency-Check in Docker
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p dependency-check-report
          docker run --rm \
            -e NVD_API_KEY="${NVD_API_KEY}" \
            -v "$(pwd):/src" \
            owasp/dependency-check \
            --project "MattinAI_job_offers" \
            --scan /src \
            --format "HTML" \
            --out /src/dependency-check-report

      - name: Upload Dependency-Check HTML report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report/dependency-check-report.html

  sonarqube:
    name: SonarQube Cloud Scan
    runs-on: ubuntu-latest
    needs: dependency-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run SonarScanner CLI in Docker
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          docker run --rm \
            -e SONAR_HOST_URL="https://sonarcloud.io" \
            -e SONAR_LOGIN="${SONAR_TOKEN}" \
            -v "$(pwd):/usr/src" \
            sonarsource/sonar-scanner-cli \
            -Dsonar.projectBaseDir=/usr/src
